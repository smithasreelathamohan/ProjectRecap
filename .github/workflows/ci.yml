name: Java CI with Maven
on:
    push:
        branches: ["main"]

    pull_request:
        branches: [ "main" ]
permissions:
  contents: write
jobs:
    build:

        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v5

        - name: Set up JDK 25
          uses: actions/setup-java@v5
          with:
            java-version: '25'
            distribution: 'temurin'
            cache: 'maven'

        - name: Run tests
          run: mvn clean test

        - name: Upload Test Reports
          uses: actions/upload-artifact@v4
          if: always()
          with:
            name: test-reports
            path: target/surefire-reports/

        - name: Install Allure CLI
          run: |
            curl -o allure.tgz -L https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/2.27.0/allure-commandline-2.27.0.tgz
            tar -zxvf allure.tgz

        - name: Generate Allure report
          run: |
            ./allure-2.27.0/bin/allure generate target/allure-results -o allure-report --clean

        - name: Upload Allure Report as Artifact
          uses: actions/upload-artifact@v4
          with:
            name: allure-report
            path: allure-report
        
        - name: Deploy to GitHub Pages
          uses: peaceiris/actions-gh-pages@v4
          with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: ./allure-report